services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecutan una sola vez, en orden, la primera vez que se crea el volumen.
      - ./bdtupa20260511.sql:/docker-entrypoint-initdb.d/01-bdtupa.sql:ro
      - ./database/migrations.sql:/docker-entrypoint-initdb.d/02-migrations.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-1234}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_NAME: bdtupa
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production}
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: 15
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
